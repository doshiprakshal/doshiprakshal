<svg width="100%" viewBox="0 0 800 280" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Prakshal Doshi - SRE Header</title>
  <desc>Animated terminal header for DevOps SRE GitHub profile</desc>
  <defs>
    <linearGradient id="topbar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39d353"/>
      <stop offset="50%" stop-color="#79c0ff"/>
      <stop offset="100%" stop-color="#39d353"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0L0 0 0 28" fill="none" stroke="#39d353" stroke-width="0.3" opacity="0.12"/>
    </pattern>
    <clipPath id="clip"><rect width="800" height="280" rx="10"/></clipPath>
  </defs>

  <!-- background -->
  <rect width="800" height="280" rx="10" fill="#0d1117"/>
  <rect width="800" height="280" rx="10" fill="url(#grid)"/>

  <!-- scan line band -->
  <rect clip-path="url(#clip)" x="0" y="0" width="800" height="80" fill="url(#scangrad)" opacity="1">
    <animateTransform attributeName="transform" type="translate" from="0,-80" to="0,280" dur="5s" repeatCount="indefinite"/>
  </rect>
  <defs>
    <linearGradient id="scangrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#39d353" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#39d353" stop-opacity="0.05"/>
      <stop offset="50%"  stop-color="#39d353" stop-opacity="0.12"/>
      <stop offset="60%"  stop-color="#39d353" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#39d353" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- top accent bar -->
  <rect x="0" y="0" width="800" height="3" fill="url(#topbar)" rx="2"/>

  <!-- avatar circle -->
  <circle cx="72" cy="88" r="40" fill="#161b22" stroke="#39d353" stroke-width="2"/>
  <!-- pulse ring -->
  <circle cx="72" cy="88" r="40" fill="none" stroke="#39d353" stroke-width="1.5" opacity="0.3">
    <animate attributeName="r" values="40;47;40" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <text x="72" y="93" text-anchor="middle" fill="#39d353" font-family="'Courier New',monospace" font-size="13" font-weight="700">SRE</text>

  <!-- status dot -->
  <circle cx="126" cy="52" r="5" fill="#39d353">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="135" y="57" fill="#39d353" font-family="'Courier New',monospace" font-size="10">systems nominal · 20,000+ TPS · uptime 99.97%</text>

  <!-- name -->
  <text x="124" y="80" fill="#f0f6fc" font-family="'Courier New',monospace" font-size="24" font-weight="700" opacity="0">
    Prakshal Doshi
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.2s" fill="freeze"/>
  </text>

  <!-- handle -->
  <text x="126" y="100" fill="#39d353" font-family="'Courier New',monospace" font-size="12" opacity="0">
    @doshiprakshal
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.4s" fill="freeze"/>
  </text>

  <!-- tagline -->
  <text x="126" y="120" fill="#8b949e" font-family="'Courier New',monospace" font-size="11" opacity="0">
    Site Reliability Engineer · Apple · ex-JPMC · ex-Autodesk · ex-Quantiphi
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.6s" fill="freeze"/>
  </text>

  <!-- divider -->
  <line x1="24" y1="148" x2="776" y2="148" stroke="#21262d" stroke-width="1"/>

  <!-- CI/CD pipeline strip -->
  <text x="24" y="168" fill="#6e7681" font-family="'Courier New',monospace" font-size="9" letter-spacing="1.5">PIPELINE</text>

  <!-- step boxes -->
  <!-- build -->
  <rect x="82" y="156" width="64" height="20" rx="4" fill="#1a2f1a" stroke="#39d353" stroke-width="0.8" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.8s" fill="freeze"/>
  </rect>
  <text x="114" y="170" text-anchor="middle" fill="#39d353" font-family="'Courier New',monospace" font-size="10" opacity="0">
    build ✓
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.8s" fill="freeze"/>
  </text>
  <!-- arrow -->
  <text x="152" y="170" fill="#30363d" font-family="'Courier New',monospace" font-size="10" opacity="0">▶
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.1s" fill="freeze"/>
  </text>
  <!-- test -->
  <rect x="162" y="156" width="56" height="20" rx="4" fill="#1a2f1a" stroke="#39d353" stroke-width="0.8" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.1s" fill="freeze"/>
  </rect>
  <text x="190" y="170" text-anchor="middle" fill="#39d353" font-family="'Courier New',monospace" font-size="10" opacity="0">
    test ✓
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.1s" fill="freeze"/>
  </text>
  <!-- arrow -->
  <text x="224" y="170" fill="#30363d" font-family="'Courier New',monospace" font-size="10" opacity="0">▶
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.4s" fill="freeze"/>
  </text>
  <!-- deploy -->
  <rect x="234" y="156" width="68" height="20" rx="4" fill="#1a2f1a" stroke="#39d353" stroke-width="0.8" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.4s" fill="freeze"/>
  </rect>
  <text x="268" y="170" text-anchor="middle" fill="#39d353" font-family="'Courier New',monospace" font-size="10" opacity="0">
    deploy ✓
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.4s" fill="freeze"/>
  </text>
  <!-- arrow -->
  <text x="308" y="170" fill="#30363d" font-family="'Courier New',monospace" font-size="10" opacity="0">▶
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.7s" fill="freeze"/>
  </text>
  <!-- monitor -->
  <rect x="318" y="156" width="74" height="20" rx="4" fill="#1a2f1a" stroke="#39d353" stroke-width="0.8" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.7s" fill="freeze"/>
  </rect>
  <text x="355" y="170" text-anchor="middle" fill="#39d353" font-family="'Courier New',monospace" font-size="10" opacity="0">
    monitor ✓
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.7s" fill="freeze"/>
  </text>

  <!-- SLO metrics right side -->
  <text x="530" y="162" fill="#6e7681" font-family="'Courier New',monospace" font-size="9" letter-spacing="1.5">SLO</text>
  <text x="580" y="162" fill="#8b949e" font-family="'Courier New',monospace" font-size="10">availability</text>
  <text x="776" y="162" text-anchor="end" fill="#39d353" font-family="'Courier New',monospace" font-size="10" font-weight="700">99.97%</text>
  <text x="580" y="178" fill="#8b949e" font-family="'Courier New',monospace" font-size="10">MTTR</text>
  <text x="776" y="178" text-anchor="end" fill="#39d353" font-family="'Courier New',monospace" font-size="10" font-weight="700">&lt; 4 min</text>

  <!-- divider 2 -->
  <line x1="24" y1="192" x2="776" y2="192" stroke="#21262d" stroke-width="1"/>

  <!-- badge row 1 -->
  <text x="24" y="210" fill="#6e7681" font-family="'Courier New',monospace" font-size="9" letter-spacing="1.5">STACK</text>

  <!-- badges row 1 -->
  <rect x="72"  y="198" width="82" height="18" rx="4" fill="none" stroke="#326CE5" stroke-width="0.8" opacity="0.6"/>
  <text x="113" y="211" text-anchor="middle" fill="#79c0ff" font-family="'Courier New',monospace" font-size="9">Kubernetes</text>

  <rect x="160" y="198" width="72" height="18" rx="4" fill="none" stroke="#7B42BC" stroke-width="0.8" opacity="0.6"/>
  <text x="196" y="211" text-anchor="middle" fill="#bc8cff" font-family="'Courier New',monospace" font-size="9">Terraform</text>

  <rect x="238" y="198" width="58" height="18" rx="4" fill="none" stroke="#39d353" stroke-width="0.8" opacity="0.6"/>
  <text x="267" y="211" text-anchor="middle" fill="#39d353" font-family="'Courier New',monospace" font-size="9">Ansible</text>

  <rect x="302" y="198" width="84" height="18" rx="4" fill="none" stroke="#E6522C" stroke-width="0.8" opacity="0.6"/>
  <text x="344" y="211" text-anchor="middle" fill="#f85149" font-family="'Courier New',monospace" font-size="9">Prometheus</text>

  <rect x="392" y="198" width="62" height="18" rx="4" fill="none" stroke="#F46800" stroke-width="0.8" opacity="0.6"/>
  <text x="423" y="211" text-anchor="middle" fill="#ff7b01" font-family="'Courier New',monospace" font-size="9">Grafana</text>

  <rect x="460" y="198" width="54" height="18" rx="4" fill="none" stroke="#F46800" stroke-width="0.8" opacity="0.6"/>
  <text x="487" y="211" text-anchor="middle" fill="#ff7b01" font-family="'Courier New',monospace" font-size="9">Splunk</text>

  <rect x="520" y="198" width="44" height="18" rx="4" fill="none" stroke="#FF9900" stroke-width="0.8" opacity="0.6"/>
  <text x="542" y="211" text-anchor="middle" fill="#ff7b01" font-family="'Courier New',monospace" font-size="9">AWS</text>

  <rect x="570" y="198" width="40" height="18" rx="4" fill="none" stroke="#4285F4" stroke-width="0.8" opacity="0.6"/>
  <text x="590" y="211" text-anchor="middle" fill="#79c0ff" font-family="'Courier New',monospace" font-size="9">GCP</text>

  <rect x="616" y="198" width="44" height="18" rx="4" fill="none" stroke="#3776AB" stroke-width="0.8" opacity="0.6"/>
  <text x="638" y="211" text-anchor="middle" fill="#79c0ff" font-family="'Courier New',monospace" font-size="9">Python</text>

  <rect x="666" y="198" width="44" height="18" rx="4" fill="none" stroke="#4EAA25" stroke-width="0.8" opacity="0.6"/>
  <text x="688" y="211" text-anchor="middle" fill="#39d353" font-family="'Courier New',monospace" font-size="9">Bash</text>

  <!-- badges row 2 -->
  <rect x="72"  y="222" width="110" height="18" rx="4" fill="none" stroke="#2088FF" stroke-width="0.8" opacity="0.6"/>
  <text x="127" y="235" text-anchor="middle" fill="#79c0ff" font-family="'Courier New',monospace" font-size="9">GitHub Actions</text>

  <rect x="188" y="222" width="62" height="18" rx="4" fill="none" stroke="#D24939" stroke-width="0.8" opacity="0.6"/>
  <text x="219" y="235" text-anchor="middle" fill="#f85149" font-family="'Courier New',monospace" font-size="9">Jenkins</text>

  <rect x="256" y="222" width="70" height="18" rx="4" fill="none" stroke="#EF7B4D" stroke-width="0.8" opacity="0.6"/>
  <text x="291" y="235" text-anchor="middle" fill="#ff7b01" font-family="'Courier New',monospace" font-size="9">Spinnaker</text>

  <rect x="332" y="222" width="44" height="18" rx="4" fill="none" stroke="#0F1689" stroke-width="0.8" opacity="0.6"/>
  <text x="354" y="235" text-anchor="middle" fill="#79c0ff" font-family="'Courier New',monospace" font-size="9">Helm</text>

  <rect x="382" y="222" width="98" height="18" rx="4" fill="none" stroke="#bc8cff" stroke-width="0.8" opacity="0.6"/>
  <text x="431" y="235" text-anchor="middle" fill="#bc8cff" font-family="'Courier New',monospace" font-size="9">MCP / GenAI</text>

  <rect x="486" y="222" width="80" height="18" rx="4" fill="none" stroke="#06AC38" stroke-width="0.8" opacity="0.6"/>
  <text x="526" y="235" text-anchor="middle" fill="#39d353" font-family="'Courier New',monospace" font-size="9">PagerDuty</text>

  <rect x="572" y="222" width="62" height="18" rx="4" fill="none" stroke="#632CA6" stroke-width="0.8" opacity="0.6"/>
  <text x="603" y="235" text-anchor="middle" fill="#bc8cff" font-family="'Courier New',monospace" font-size="9">Datadog</text>

  <rect x="640" y="222" width="44" height="18" rx="4" fill="none" stroke="#231F20" stroke-width="0.8" opacity="0.5"/>
  <text x="662" y="235" text-anchor="middle" fill="#8b949e" font-family="'Courier New',monospace" font-size="9">Kafka</text>

  <!-- footer -->
  <line x1="24" y1="252" x2="776" y2="252" stroke="#21262d" stroke-width="1"/>
  <text x="24"  y="267" fill="#6e7681" font-family="'Courier New',monospace" font-size="9">🏆 Google Cloud "Best Infrastructure" · ⭐ Quantiphi Star Performer · CKA · CKAD · AWS-SA · Terraform · GCP-CE</text>
  <text x="776" y="267" text-anchor="end" fill="#39d353" font-family="'Courier New',monospace" font-size="9">last deployed: today</text>

</svg>
